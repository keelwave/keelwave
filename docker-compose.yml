services:
  db:
    image: timescale/timescaledb:latest-pg18
    environment:
      POSTGRES_USER: keelwave
      POSTGRES_PASSWORD: keelwave
      POSTGRES_DB: keelwave
    ports:
      - "5432:5432"
    volumes:
      - keelwave_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keelwave -d keelwave"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    profiles: ["app"]
    image: migrate/migrate:v4.19.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./cmd/migrate/migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://keelwave:keelwave@db:5432/keelwave?sslmode=disable"
      - "up"

  app:
    profiles: ["app"]
    build:
      context: .
      args:
        VERSION: dev
    image: ghcr.io/keelwave/keelwave:local
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ADDR: ":8080"
      ENV: "development"
      DB_ADDR: "postgres://keelwave:keelwave@db:5432/keelwave?sslmode=disable"
      # Dashboard is served same-origin by this binary, so it and the API share
      # http://localhost:8080. CORS only matters for cross-origin SDK ingest.
      CORS_ALLOWED_ORIGINS: "http://localhost:8080"
      PUBLIC_URL: "http://localhost:8080"
      DASHBOARD_URL: "http://localhost:8080"
    ports:
      - "8080:8080"

volumes:
  keelwave_db:
